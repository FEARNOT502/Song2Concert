<title>Song2Concert Venue Lab</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200;0,300;0,400;0,500;0,800;0,900;1,200;1,300&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: #e5e5e5;
    --dim: #8a8a8a;
    --deep: #4a4a4a;
    --accent: #ff9745;
    --accent-glow: rgba(255, 151, 69, 0.35);
    --hair: rgba(255, 255, 255, 0.13);
    --panel: rgba(4, 4, 5, 0.62);
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @supports (color: oklch(0.78 0.16 55)) {
    :root { --accent: oklch(0.78 0.16 55); --accent-glow: oklch(0.78 0.16 55 / 0.35); }
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-glow); color: #fff; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }

  .label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, label:focus-within { outline: 1px solid var(--accent); outline-offset: 3px; }

  /* top bar */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 40;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 20px;
    background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hair);
  }
  .mark { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .mark i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
  .mark b { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: 0.28em; }
  .mark span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; color: var(--dim); }
  #tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap;
    color: var(--dim); padding: 8px 12px; border-bottom: 1px solid transparent;
  }
  #tabs button:hover { color: var(--fg); }
  #tabs button[aria-current="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  #tabs button:disabled { color: var(--deep); cursor: default; }
  .controls { display: flex; align-items: center; gap: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); }
  .seg button { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 10px; color: var(--dim); }
  .seg button[aria-pressed="true"] { color: #000; background: var(--fg); }
  .seg button:not([aria-pressed="true"]):hover { color: var(--fg); }
  #fps { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--deep); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }

  /* rails */
  .rail {
    position: fixed; z-index: 20; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hair); padding: 16px 18px;
  }
  .left { left: 16px; width: 300px; }
  .right { right: 16px; width: 300px; }
  #v-name { font-weight: 300; font-size: 30px; letter-spacing: -0.02em; line-height: 1; margin: 8px 0 6px; }
  #v-ref { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; align-items: baseline; border-top: 1px solid var(--hair); padding-top: 12px; }
  .grid dd { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .grid dd small { color: var(--dim); font-size: 11px; margin-left: 3px; }
  .grid dt { margin: 0; }

  .tone-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #tone-note { font-size: 12px; color: var(--dim); margin: 10px 0 12px; line-height: 1.45; }
  #covers { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 6px; }
  .cover { aspect-ratio: 1; border: 1px solid var(--hair); overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover[aria-pressed="true"] { outline: 1px solid var(--accent); outline-offset: 2px; }
  #cover-upload { aspect-ratio: 1; border: 1px dashed var(--deep); display: grid; place-items: center; cursor: pointer; color: var(--dim); font-family: var(--mono); font-size: 16px; }
  #cover-upload:hover { color: var(--fg); border-color: var(--dim); }
  #swatches { display: flex; gap: 4px; margin-top: 12px; }
  #swatches span { flex: 1; height: 8px; }
  .crowd-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
  .beat { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); flex-wrap: wrap; }
  .beat button, .beat label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; padding: 6px 10px; border: 1px solid var(--hair); color: var(--fg); cursor: pointer; }
  .beat button:hover, .beat label:hover { border-color: var(--dim); }
  #beat-label { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.1em; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .hint { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); color: var(--deep); pointer-events: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none; }
  #loading div { text-align: center; }
  #loading-name { font-weight: 300; font-size: 22px; margin-top: 8px; }
  #tone-toggle { display: none; }

  @media (max-width: 1100px) { .hint { display: none; } }
  @media (max-width: 860px) {
    .top { flex-wrap: wrap; gap: 10px 14px; }
    #tabs { order: 3; flex-basis: 100%; }
    .mark span { display: none; }
    .left { width: auto; right: 16px; padding: 12px 14px; }
    .left .grid { grid-template-columns: repeat(4, auto 1fr); font-size: 12px; }
    #v-name { font-size: 22px; }
    .right { display: none; left: 16px; width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
    body.tone-open .right { display: block; }
    #tone-toggle { display: inline-block; }
  }
  @media (max-width: 520px) {
    .left { padding: 10px 12px; }
    .left .grid { grid-template-columns: auto 1fr; gap: 4px 12px; padding-top: 8px; }
    .left .grid dt:nth-of-type(n+4), .left .grid dd:nth-of-type(n+4) { display: none; }
    .grid dd { font-size: 12px; }
    #v-name { font-size: 20px; margin: 4px 0 2px; }
    #v-ref { margin-bottom: 8px; font-size: 11px; }
    #fps { display: none; }
    .right { bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="stage" aria-label="공연장 3D 장면. 드래그해서 둘러볼 수 있습니다."></canvas>

<header class="top">
  <div class="mark"><i aria-hidden="true"></i><b>SONG2CONCERT</b><span>VENUE LAB</span></div>
  <nav id="tabs" aria-label="공연장"></nav>
  <div class="controls">
    <div class="seg" id="seg-lights" role="group" aria-label="조명 상태">
      <button type="button" data-v="show" id="lights-show">공연 중</button>
      <button type="button" data-v="house" id="lights-house">입장 전</button>
    </div>
    <div class="seg" id="seg-quality" role="group" aria-label="렌더 품질">
      <button type="button" data-v="high" id="q-high">High</button>
      <button type="button" data-v="low" id="q-low">Low</button>
    </div>
    <button type="button" id="tone-toggle" class="label">Tone</button>
    <span id="fps" aria-live="off"></span>
  </div>
</header>

<section class="rail left" aria-label="공연장 정보">
  <div class="label" id="v-type"></div>
  <div id="v-name"></div>
  <div id="v-ref"></div>
  <dl class="grid">
    <dt class="label">Seat</dt><dd><span id="v-seat"></span><small id="v-dist"></small></dd>
    <dt class="label">RT60</dt><dd><span id="v-rt"></span><small>s</small></dd>
    <dt class="label">Volume</dt><dd><span id="v-vol"></span><small>m³</small></dd>
    <dt class="label">Warmth</dt><dd><span id="v-warm"></span></dd>
    <dt class="label">1st refl.</dt><dd><span id="v-refl"></span><small>ms</small></dd>
  </dl>
</section>

<section class="rail right" aria-label="조명 색조">
  <div class="tone-head">
    <span class="label">Lighting tone</span>
    <div class="seg" id="seg-tone" role="group" aria-label="색조 출처">
      <button type="button" data-v="app" id="tone-app">App</button>
      <button type="button" data-v="art" id="tone-art">Album art</button>
    </div>
  </div>
  <p id="tone-note"></p>
  <div id="covers">
    <label id="cover-upload" title="앨범아트 이미지 올리기">+<input type="file" id="cover-file" accept="image/*" class="visually-hidden"></label>
  </div>
  <div id="swatches" aria-label="현재 조명 팔레트"></div>
  <div class="crowd-row" id="crowd-row" hidden>
    <span class="label">Crowd light</span>
    <div class="seg" id="seg-crowd" role="group" aria-label="관객 빛">
      <button type="button" data-v="stick">응원봉</button>
      <button type="button" data-v="flash">플래시</button>
    </div>
  </div>
  <div class="crowd-row" id="stage-row" hidden>
    <span class="label">스테이지 샘플</span>
    <div class="seg" id="seg-stage" role="group" aria-label="스테이지 샘플">
      <button type="button" data-v="0">현재</button>
      <button type="button" data-v="1">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
    </div>
  </div>
  <div class="crowd-row" id="retract-row" hidden>
    <span class="label" id="retract-label">100번대 가변석</span>
    <div class="seg" id="seg-retract" role="group" aria-label="100번대 가변석">
      <button type="button" data-v="out">펼침</button>
      <button type="button" data-v="in">접음 · 플로어 확장</button>
    </div>
  </div>
  <div class="beat">
    <button type="button" id="beat-toggle" aria-pressed="true">비트 멈추기</button>
    <label for="audio-file">음원 연결<input type="file" id="audio-file" accept="audio/*" class="visually-hidden"></label>
    <span id="beat-label">122 BPM 시뮬레이션 · 곡 구조: verse → pre → chorus → break</span>
  </div>
</section>

<div class="hint label">드래그로 둘러보기 · WASD 이동 (Shift 달리기) · 더블클릭 제자리 · ← → 공연장 · H 조명</div>
<div id="loading" hidden><div><div class="label">Building venue</div><div id="loading-name"></div></div></div>
