<!doctype html>
<meta charset="utf-8">
<title>audio smoke</title>
<pre id="out">running…</pre>
<script type="module">
import { buildGraph, applyVenue, wetTrimDb, INPUT_TRIM_DB } from '/src/audio/graph.js';
import { VENUES } from '/src/data.js';
import { ConcertEngine } from '/src/audio/engine.js';
import { synthesizeIR, venueSeed } from '/src/audio/impulse.js';
import { clarity, octaveBand, reverbTime } from '/src/audio/iranalysis.js';

const results = [];
const log = (o) => results.push(o);

// A drum-ish test signal: sharp transients over a sustained low tone, so the
// transient shaper, the loudness shelf and the limiter all get exercised.
function testSignal(ctx, seconds) {
  const sr = ctx.sampleRate;
  const n = Math.floor(sr * seconds);
  const buf = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      d[i] = 0.25 * Math.sin(2 * Math.PI * 90 * t) + 0.08 * Math.sin(2 * Math.PI * 1500 * t + c);
      const beat = t % 0.5;
      if (beat < 0.01) d[i] += 0.5 * Math.exp(-beat * 400) * (Math.random() * 2 - 1);
    }
  }
  return buf;
}

const stats = (buf) => {
  let peak = 0, sum = 0, n = 0, nan = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) {
      const v = d[i];
      if (!Number.isFinite(v)) { nan++; continue; }
      const a = Math.abs(v);
      if (a > peak) peak = a;
      sum += v * v; n++;
    }
  }
  return { peak, rms: Math.sqrt(sum / Math.max(n, 1)), nan };
};

async function run() {
  for (const venue of VENUES) {
    const sr = 48000;
    const seconds = 3;
    const ctx = new OfflineAudioContext(2, sr * (seconds + 2), sr);
    let worklets = {};
    try {
      await ctx.audioWorklet.addModule('/Song2Concert/transient-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/vocal-anchor-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/glue-processor.js');
      worklets = { transient: true, vocalAnchor: true, limiter: true, glue: true };
    } catch (e) {
      log({ venue: venue.id, workletError: String(e.message) });
    }
    const g = buildGraph(ctx, { venue, volume: 1, wetDb: wetTrimDb(venue.position.wet, venue.position.wet), worklets });
    g.limiter.connect(ctx.destination);
    const src = ctx.createBufferSource();
    src.buffer = testSignal(ctx, seconds);
    src.connect(g.trim);
    src.start(0);
    const out = await ctx.startRendering();
    const st = stats(out);
    log({
      venue: venue.id,
      irChannels: g.convA.buffer.numberOfChannels,
      irSeconds: +(g.convA.buffer.duration.toFixed(2)),
      worklets: Object.keys(worklets).length,
      peak: +st.peak.toFixed(4),
      rms: +st.rms.toFixed(4),
      nan: st.nan,
    });
  }

  // Crossfeed must leave a MONO signal mathematically untouched: it is a shelf
  // on the side signal, and a mono signal has no side signal.
  {
    const sr = 48000;
    const ctx = new OfflineAudioContext(2, sr, sr);
    const g = buildGraph(ctx, { venue: VENUES[0], volume: 1, wetDb: -1000, worklets: {} });
    // measure just the crossfeed section
    const src = ctx.createBufferSource();
    const buf = ctx.createBuffer(2, sr, sr);
    for (let i = 0; i < sr; i++) {
      const v = Math.sin(2 * Math.PI * 200 * i / sr) * 0.5;
      buf.getChannelData(0)[i] = v;
      buf.getChannelData(1)[i] = v; // identical → pure mid, no side
    }
    src.buffer = buf;
    src.connect(g.direct);
    g.msMerge.connect(ctx.destination);
    src.start(0);
    const out = await ctx.startRendering();
    let maxDiff = 0;
    const L = out.getChannelData(0), R = out.getChannelData(1);
    const inp = buf.getChannelData(0);
    for (let i = 2000; i < sr - 2000; i++) {
      maxDiff = Math.max(maxDiff, Math.abs(L[i] - inp[i]), Math.abs(L[i] - R[i]));
    }
    log({ test: 'crossfeed mono transparency', maxDeviation: +maxDiff.toExponential(2) });
  }

  // A four-channel response is only worth generating if the ConvolverNode
  // actually applies it as a matrix. The spec says it should —
  //   outL = inL ⊛ IR0 + inR ⊛ IR2 ,  outR = inL ⊛ IR1 + inR ⊛ IR3
  // — but a browser that ignored channels 2 and 3 would still accept the buffer
  // and still make sound, so accepting it proves nothing. Feeding one channel at
  // a time distinguishes the two: with true stereo, a left-only input produces
  // output on the right and a right-only input produces output on the left.
  {
    const sr = 48000;
    const measure = async (side) => {
      const ctx = new OfflineAudioContext(2, sr, sr);
      const g = buildGraph(ctx, { venue: VENUES[1], volume: 1, wetDb: 0, worklets: {} });
      const buf = ctx.createBuffer(2, 128, sr);
      buf.getChannelData(side)[0] = 1; // an impulse into one channel only
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(g.convA);
      g.wet.connect(ctx.destination);
      src.start(0);
      const out = await ctx.startRendering();
      const e = (c) => { let s = 0; const d = out.getChannelData(c); for (let i = 0; i < d.length; i++) s += d[i] * d[i]; return s; };
      return { toL: e(0), toR: e(1) };
    };
    const fromL = await measure(0);
    const fromR = await measure(1);
    log({
      test: 'true-stereo convolution',
      leftInputReachesRightOutput: fromL.toR > fromL.toL * 0.01,
      rightInputReachesLeftOutput: fromR.toL > fromR.toR * 0.01,
      // The two source positions are mirrored, so a left input should favour the
      // left output and a right input the right.
      leftInputFavoursLeft: fromL.toL > fromL.toR,
      rightInputFavoursRight: fromR.toR > fromR.toL,
    });
  }

  // Clarity measured through the WHOLE graph, not just the impulse response.
  // The send tilt, the wet level and the response all decide how buried a vocal
  // ends up, and only two of those live in the response — so measuring the
  // response alone cannot see the thing being complained about. An impulse goes
  // in at a level low enough to keep the compressor and limiter linear, and what
  // comes out is the system's own response.
  //
  // C50 in the 2 kHz octave is the speech-intelligibility figure: energy in the
  // first 50 ms against everything after it, in the band where consonants live.
  // Above roughly +2 dB a lyric stays legible; below zero it starts to wash.
  for (const venue of VENUES) {
    const sr = 48000;
    const ctx = new OfflineAudioContext(2, sr * 6, sr);
    let worklets = {};
    try {
      await ctx.audioWorklet.addModule('/Song2Concert/transient-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/vocal-anchor-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/glue-processor.js');
      worklets = { transient: true, vocalAnchor: true, limiter: true, glue: true };
    } catch (e) { /* measured without them */ }
    const g = buildGraph(ctx, { venue, volume: 1, wetDb: wetTrimDb(venue.position.wet, venue.position.wet), worklets });
    g.limiter.connect(ctx.destination);
    const buf = ctx.createBuffer(2, 128, sr);
    buf.getChannelData(0)[0] = 0.05;
    buf.getChannelData(1)[0] = 0.05;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(g.trim);
    src.start(0);
    const out = await ctx.startRendering();
    const mono = new Float32Array(out.length);
    const L = out.getChannelData(0), R = out.getChannelData(1);
    for (let i = 0; i < out.length; i++) mono[i] = (L[i] + R[i]) / 2;
    // How much low-frequency ROOM there is relative to the low-frequency direct
    // sound. Clarity figures cannot be compared across these venues in the low
    // band: C50 counts everything past 50 ms as late, and the stadium's first
    // reflection does not arrive until 112 ms, so a long initial gap reads as
    // poor definition when it is nothing of the kind. A wet-against-dry ratio
    // does not care when the energy arrives, only how much of it there is.
    const lowWetDry = await (async () => {
      const tap = async (which) => {
        const c = new OfflineAudioContext(2, sr * 6, sr);
        try { await c.audioWorklet.addModule('/Song2Concert/limiter-processor.js'); } catch (e) { /* noop */ }
        const gg = buildGraph(c, { venue, volume: 1, wetDb: wetTrimDb(venue.position.wet, venue.position.wet), worklets: { limiter: true } });
        gg[which].connect(c.destination);
        const b = c.createBuffer(2, 128, sr);
        b.getChannelData(0)[0] = 0.05; b.getChannelData(1)[0] = 0.05;
        const s2 = c.createBufferSource(); s2.buffer = b; s2.connect(gg.trim); s2.start(0);
        const o = await c.startRendering();
        const m2 = new Float32Array(o.length);
        const A = o.getChannelData(0), B = o.getChannelData(1);
        for (let i = 0; i < o.length; i++) m2[i] = (A[i] + B[i]) / 2;
        const bandLow = octaveBand(m2, sr, 125);
        let e = 0; for (let i = 0; i < bandLow.length; i++) e += bandLow[i] * bandLow[i];
        return e;
      };
      return 10 * Math.log10((await tap('wet')) / (await tap('dry')));
    })();

    // Booming is how long the low end goes on ringing through the WHOLE chain,
    // and low-end definition is how much of its energy lands in the first
    // 50 ms rather than after. Both are measured in the 125 Hz octave, where a
    // kick and a bass live and where a large room rings longest.
    const low = octaveBand(mono, sr, 125);
    log({
      test: 'system clarity',
      venue: venue.id,
      c80: +clarity(mono, sr, 80).toFixed(1),
      c50vocal: +clarity(octaveBand(mono, sr, 2000), sr, 50).toFixed(1),
      lowRoomVsDirect_dB: +lowWetDry.toFixed(1),
      lowRingT20_s: +reverbTime(low, sr).toFixed(2),
    });
  }
  // A limiter must be a wire below its threshold. This check exists because the
  // DynamicsCompressor previously used as one was not: fed an impulse 34 dB
  // under threshold it applied 11.6 dB of gain reduction, ducking every
  // transient and releasing into the reverberation behind it. Nothing in the
  // build caught that, because the graph was connected correctly and did make
  // sound — it was simply making the wrong one.
  {
    const sr = 48000;
    const venue = VENUES.find((v) => v.id === 'hall');
    const measure = async (node, worklets) => {
      const ctx = new OfflineAudioContext(2, sr * 6, sr);
      try { await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js'); } catch (e) { /* noop */ }
      const g = buildGraph(ctx, { venue, volume: 1, wetDb: 0, worklets });
      g[node].connect(ctx.destination);
      const buf = ctx.createBuffer(2, 128, sr);
      buf.getChannelData(0)[0] = 0.05; buf.getChannelData(1)[0] = 0.05;
      const src = ctx.createBufferSource(); src.buffer = buf; src.connect(g.trim); src.start(0);
      const out = await ctx.startRendering();
      const m = new Float32Array(out.length);
      const L = out.getChannelData(0), R = out.getChannelData(1);
      for (let i = 0; i < out.length; i++) m[i] = (L[i] + R[i]) / 2;
      let peak = 0; for (let i = 0; i < m.length; i++) if (Math.abs(m[i]) > peak) peak = Math.abs(m[i]);
      return { peak, c50: clarity(octaveBand(m, sr, 2000), sr, 50) };
    };
    const before = await measure('volume', { limiter: true });
    const after = await measure('limiter', { limiter: true });
    log({
      test: 'limiter transparent below threshold',
      inputPeak_dBFS: +(20 * Math.log10(before.peak)).toFixed(1),
      gainChange_dB: +(20 * Math.log10(after.peak / before.peak)).toFixed(2),
      clarityChange_dB: +(after.c50 - before.c50).toFixed(2),
    });
  }

  // How long after a hit the room starts answering. This is the difference
  // between reverberation and a delay effect: if the wet path is silent for a
  // tenth of a second and then swells, a sparse repeating figure hears it as an
  // echo landing off the grid. An EDM intro at 128 BPM puts a sixteenth note at
  // 117 ms, which is roughly where Wembley's first boundary reflection arrives —
  // so tying the diffuse field's onset to that reflection, as this once did, put
  // the reverb of every kick squarely on the offbeat.
  //
  // Reported as the time by which the wet path has delivered 5 % of its first
  // 300 ms of energy. It has to be small enough that no musical subdivision can
  // line up with it.
  for (const venue of VENUES) {
    const sr = 48000;
    const ctx = new OfflineAudioContext(2, sr * 2, sr);
    try { await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js'); } catch (e) { /* noop */ }
    const g = buildGraph(ctx, { venue, volume: 1, wetDb: wetTrimDb(venue.position.wet, venue.position.wet), worklets: { limiter: true } });
    g.wet.connect(ctx.destination);
    const buf = ctx.createBuffer(2, 128, sr);
    buf.getChannelData(0)[0] = 0.05; buf.getChannelData(1)[0] = 0.05;
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(g.trim); src.start(0);
    const out = await ctx.startRendering();
    const L = out.getChannelData(0), R = out.getChannelData(1);
    const win = Math.floor(sr * 0.3);
    let total = 0;
    for (let i = 0; i < win; i++) total += L[i] * L[i] + R[i] * R[i];
    let acc = 0, onset = 0;
    for (let i = 0; i < win; i++) {
      acc += L[i] * L[i] + R[i] * R[i];
      if (acc >= total * 0.05) { onset = (i / sr) * 1000; break; }
    }
    log({ test: 'room answers promptly', venue: venue.id, reverbOnset_ms: +onset.toFixed(1) });
  }

  // Two things the reverb send has to do at once: take room off the VOICE
  // without taking it off the BAND. Centred and wide impulses are measured
  // separately — the centre should gain clarity, the sides should be left alone.
  {
    const sr = 48000;
    const venue = VENUES.find((v) => v.id === 'hall');
    const probe = async (wide) => {
      const ctx = new OfflineAudioContext(2, sr * 6, sr);
      try { await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js'); } catch (e) { /* noop */ }
      const g = buildGraph(ctx, { venue, volume: 1, wetDb: 0, worklets: { limiter: true } });
      g.limiter.connect(ctx.destination);
      const buf = ctx.createBuffer(2, 128, sr);
      buf.getChannelData(0)[0] = 0.05;
      buf.getChannelData(1)[0] = wide ? -0.05 : 0.05; // side vs centre
      const src = ctx.createBufferSource(); src.buffer = buf; src.connect(g.trim); src.start(0);
      const out = await ctx.startRendering();
      const m = new Float32Array(out.length);
      const L = out.getChannelData(0), R = out.getChannelData(1);
      // Recover the component under test rather than the sum, so a side-only
      // probe is not cancelled by the mono fold.
      for (let i = 0; i < out.length; i++) m[i] = wide ? (L[i] - R[i]) / 2 : (L[i] + R[i]) / 2;
      return clarity(octaveBand(m, sr, 2000), sr, 50);
    };
    const centre = await probe(false);
    const sides = await probe(true);
    log({
      test: 'vocal gets less room than the band (hall)',
      centreC50vocal: +centre.toFixed(1),
      sideC50vocal: +sides.toFixed(1),
      centreAdvantage_dB: +(centre - sides).toFixed(1),
    });
  }

  // Does the anchor actually push the vocal forward when the arrangement piles
  // up? A steady centred tone plays throughout while wide instrumentation stays
  // quiet for the first half and loud for the second. Its level is read at its
  // own frequency by Goertzel, so a second of averaging leaves the broadband
  // instrumentation contributing almost nothing to the reading.
  {
    const sr = 48000;
    const seconds = 20;
    const venue = VENUES.find((v) => v.id === 'arena');
    const run = async (anchorOn) => {
      const ctx = new OfflineAudioContext(2, sr * seconds, sr);
      try {
        await ctx.audioWorklet.addModule('/Song2Concert/vocal-anchor-processor.js');
        await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js');
      } catch (e) { /* noop */ }
      const g = buildGraph(ctx, { venue, volume: 1, wetDb: -60, worklets: { limiter: true, vocalAnchor: anchorOn } });
      g.limiter.connect(ctx.destination);
      const buf = ctx.createBuffer(2, sr * seconds, sr);
      const Lc = buf.getChannelData(0), Rc = buf.getChannelData(1);
      let lp = 0;
      for (let i = 0; i < buf.length; i++) {
        const t = i / sr;
        const vocal = 0.12 * Math.sin(2 * Math.PI * 2600 * t);   // centred, constant
        lp += 0.25 * ((Math.random() * 2 - 1) - lp);
        const dense = t > seconds / 2 ? 1 : 0.12;                 // sparse → dense
        const band = lp * 1.2 * dense;
        Lc[i] = vocal + band;
        Rc[i] = vocal - band;                                     // instrumentation spread wide
      }
      const src = ctx.createBufferSource(); src.buffer = buf; src.connect(g.trim); src.start(0);
      const out = await ctx.startRendering();
      // Goertzel at the vocal's frequency over one second of the centre channel.
      const level = (fromS) => {
        const n = sr;
        const k = (2 * Math.PI * 2600) / sr;
        const coef = 2 * Math.cos(k);
        let s1 = 0, s2 = 0;
        const A = out.getChannelData(0), B = out.getChannelData(1);
        for (let i = Math.floor(fromS * sr); i < Math.floor(fromS * sr) + n; i++) {
          const x = (A[i] + B[i]) / 2;
          const s0 = x + coef * s1 - s2;
          s2 = s1; s1 = s0;
        }
        return Math.sqrt(s1 * s1 + s2 * s2 - coef * s1 * s2) / n;
      };
      return { sparse: level(seconds / 2 - 2), dense: level(seconds - 2) };
    };
    const on = await run(true);
    const off = await run(false);
    const dB = (a, b) => 20 * Math.log10(a / b);
    log({
      test: 'vocal pushed forward when the arrangement piles up',
      withoutAnchor_denseVsSparse_dB: +dB(off.dense, off.sparse).toFixed(2),
      withAnchor_denseVsSparse_dB: +dB(on.dense, on.sparse).toFixed(2),
      anchorLiftInDenseSection_dB: +dB(on.dense / on.sparse, off.dense / off.sparse).toFixed(2),
    });
  }

  // Changing venue must not interrupt the audio. It used to rebuild the whole
  // graph, which detached the source, replaced the convolver so the tail was cut
  // dead, and left the old graph only partly disconnected so its worklets went
  // on running — one leaked per change.
  //
  // The direct path is what a dropout would show in, so that is what is
  // asserted: a continuous tone is rendered while the venue is switched
  // underneath it, and every 5 ms window must stay at full level.
  //
  // The total output is reported alongside but not asserted. It does dip, and
  // legitimately: a convolver handed a new response starts from silence and
  // takes the length of that response to reach steady state, which for a
  // sustained tone means several seconds in the dome. Real programme material
  // does not show it — every note played after the change is convolved
  // correctly from its first sample; only a held tone accumulates.
  {
    const sr = 48000;
    const ctx = new OfflineAudioContext(2, sr * 4, sr);
    try {
      await ctx.audioWorklet.addModule('/Song2Concert/transient-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/vocal-anchor-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/limiter-processor.js');
      await ctx.audioWorklet.addModule('/Song2Concert/glue-processor.js');
    } catch (e) { /* noop */ }
    const wk = { transient: true, vocalAnchor: true, limiter: true, glue: true };
    const g = buildGraph(ctx, { venue: VENUES[1], volume: 1, wetDb: 0, worklets: wk });
    const nodeKeys = (o) => Object.keys(o).filter((k) => o[k] && typeof o[k].connect === 'function').sort().join(',');
    const keysBefore = nodeKeys(g);

    const merge = ctx.createChannelMerger(2);
    g.dry.connect(merge, 0, 0);       // direct path only
    g.limiter.connect(merge, 0, 1);   // whole system
    merge.connect(ctx.destination);

    // Broadband noise, not a tone: a sustained sine lets the direct and
    // reverberant paths sit at some fixed relative phase and partially cancel,
    // which reads as a dip that has nothing to do with continuity.
    const noise = ctx.createBuffer(2, sr * 4, sr);
    for (let c = 0; c < 2; c++) {
      const d = noise.getChannelData(c);
      let lp = 0;
      for (let i = 0; i < d.length; i++) {
        lp += 0.06 * ((Math.random() * 2 - 1) - lp);
        d[i] = lp * 2.2;
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = noise;
    src.connect(g.trim);
    src.start(0);

    ctx.suspend(1.0).then(() => { applyVenue(ctx, g, VENUES[3]); ctx.resume(); });
    const out = await ctx.startRendering();

    // Compare the moment of the change against the half second before it. That
    // is the question being asked — does switching interrupt what is playing —
    // and it does not depend on how the signal happens to fluctuate elsewhere.
    const rms = (data, fromS, toS) => {
      let e = 0, n = 0;
      for (let i = Math.floor(fromS * sr); i < Math.floor(toS * sr) && i < data.length; i++) { e += data[i] * data[i]; n++; }
      return Math.sqrt(e / Math.max(n, 1));
    };
    const ratioAcross = (data) => rms(data, 1.0, 1.3) / rms(data, 0.5, 1.0);
    const direct = out.getChannelData(0);
    const total = out.getChannelData(1);
    log({
      test: 'venue change is seamless',
      // The direct sound must be untouched by the change.
      directLevelAcrossChange: +ratioAcross(direct).toFixed(3),
      // The total dips a little as one room's reverberation gives way to the
      // next one's, which is the change being audible rather than an interruption.
      totalLevelAcrossChange: +ratioAcross(total).toFixed(3),
      noNodesAdded: nodeKeys(g) === keysBefore,
    });
  }

  // Impulse synthesis runs on the main thread when a venue is selected, so it
  // has to stay under a frame budget or selecting a venue visibly stutters.
  for (const venue of VENUES) {
    const t0 = performance.now();
    synthesizeIR({ venueId: venue.id, sampleRate: 44100, seed: venueSeed(venue.id) });
    const cold = performance.now() - t0;
    const t1 = performance.now();
    synthesizeIR({ venueId: venue.id, sampleRate: 44100, seed: venueSeed(venue.id) });
    log({ test: 'ir build time', venue: venue.id, coldMs: Math.round(cold), cachedMs: +(performance.now() - t1).toFixed(2) });
  }

  // The export path is separate code and has to be exercised separately. A WAV
  // is assembled in memory and pushed through renderOffline exactly as a dropped
  // file would be.
  {
    const sr = 44100, n = sr * 2;
    const bytes = 44 + n * 4;
    const dv = new DataView(new ArrayBuffer(bytes));
    const ascii = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
    ascii(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); ascii(8, 'WAVEfmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true);
    dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
    ascii(36, 'data'); dv.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) {
      const v = Math.round(12000 * Math.sin(2 * Math.PI * 220 * i / sr));
      dv.setInt16(44 + i * 4, v, true); dv.setInt16(46 + i * 4, v, true);
    }
    const file = new File([dv.buffer], 'test.wav', { type: 'audio/wav' });
    const engine = new ConcertEngine();
    await engine.resume();
    await engine.loadFile(file);
    engine.setVenue(VENUES[1]);
    const { buffer, bitDepth, sampleRate } = await engine.renderOffline(VENUES[1]);
    let peak = 0;
    for (let c = 0; c < buffer.numberOfChannels; c++) {
      const d = buffer.getChannelData(c);
      for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
    }
    log({ test: 'offline export', bitDepth, sampleRate, seconds: +buffer.duration.toFixed(2), peak: +peak.toFixed(4) });
    engine.destroy();
  }

  document.getElementById('out').textContent = JSON.stringify(results, null, 1);
  window.__done = true;
}
run().catch((e) => {
  document.getElementById('out').textContent = 'ERROR ' + e.stack;
  window.__done = true;
});
</script>
