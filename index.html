<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song2Concert</title>
  <meta name="theme-color" content="#000000" />

  <!-- Favicon / touch icon (icon-exports: Wave → Hall Arc mark) -->
  <link rel="icon" type="image/svg+xml" href="/song2concert-icon-dark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Three fonts only: JetBrains Mono · Inter Tight · Instrument Serif (CLAUDE_PROMPT.md §2) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <!-- The loading cover (Scene.jsx draws the same one over the 3D view while a
       venue is built). Plain CSS here, so it is up before the app's script and
       styles arrive; only transform and opacity move, which the browser runs
       off the main thread, so it keeps moving while a room is being built. -->
  <style>
    .s2c-load { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #737373; font-family: "JetBrains Mono", ui-monospace, monospace; opacity: 1; }
    .s2c-load.is-done { opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
    .s2c-load-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; }
    .s2c-load-name { font-family: "Inter Tight", system-ui, sans-serif; font-weight: 300; font-size: 22px; color: #e5e5e5; }
    .s2c-load-bar { position: relative; width: 160px; height: 1px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    .s2c-load-bar > span { position: absolute; inset: 0 auto 0 0; width: 40%; background: oklch(0.78 0.16 55); animation: s2c-slide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite; will-change: transform; }
    .s2c-load-mark { animation: s2c-breathe 1.6s ease-in-out infinite; will-change: opacity; }
    @keyframes s2c-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes s2c-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="s2c-load" style="position: fixed">
      <svg class="s2c-load-mark" viewBox="0 0 24 24" width="34" height="34" fill="none" aria-hidden="true"><line x1="3" y1="9" x2="3" y2="15" stroke="#f3ecdc" stroke-width="1.6" stroke-linecap="round"/><line x1="5.5" y1="7" x2="5.5" y2="17" stroke="#f3ecdc" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="10" x2="8" y2="14" stroke="#f3ecdc" stroke-width="1.6" stroke-linecap="round"/><line x1="10.5" y1="6" x2="10.5" y2="18" stroke="oklch(0.78 0.16 55)" stroke-width="1.6" stroke-linecap="round"/><path d="M 14 6 Q 21 12 14 18" stroke="oklch(0.78 0.16 55)" stroke-width="1.6" stroke-linecap="round"/><path d="M 14 9 Q 18.5 12 14 15" stroke="#f3ecdc" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/><circle cx="14" cy="12" r="1.2" fill="oklch(0.78 0.16 55)"/></svg>
      <div class="s2c-load-label">Loading</div>
      <div class="s2c-load-bar"><span></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
